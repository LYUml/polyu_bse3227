%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%                                                                              %
% SU2 configuration file                                                       %
% Case description: turbulent 90 degree bend flow of Sudo (2001)               %
% Reynolds = 1.185*8.7*0.104/1.785e-5 ~ 60,000
% Author: Nijso Beishuizen                                                     %
% Date: 2023.01.07                                                             %
% File Version 7.5.0 "Blackbird"                                               %
%                                                                              %
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%
% ------------- DIRECT, ADJOINT, AND LINEARIZED PROBLEM DEFINITION ------------%
%
SOLVER= INC_RANS
INC_NONDIM= DIMENSIONAL
KIND_TURB_MODEL= SST
SST_OPTIONS= V2003m
MATH_PROBLEM= DIRECT
RESTART_SOL=YES
%
% ---------------- INCOMPRESSIBLE FLOW CONDITION DEFINITION -------------------%
%
INC_DENSITY_INIT= 1.185
INC_DENSITY_REF = 1.185
INC_VELOCITY_INIT=(0,0,8.7)
INC_VELOCITY_REF = 8.0
%
% --------------------------- VISCOSITY MODEL ---------------------------------%
%
VISCOSITY_MODEL= CONSTANT_VISCOSITY
MU_CONSTANT= 1.785e-5
%
% -------------------- BOUNDARY CONDITION DEFINITION --------------------------%
%
MARKER_HEATFLUX=(wall,0)
MARKER_SYM=(symmetry)
%
MARKER_WALL_FUNCTIONS=(wall,STANDARD_WALL_FUNCTION)
WALLMODEL_KAPPA= 0.41
WALLMODEL_B= 5.5
WALLMODEL_MINYPLUS= 1.0
WALLMODEL_MAXITER= 200
WALLMODEL_RELFAC= 0.5
%
%
% Marker(s) of the surface to be plotted or designed
MARKER_PLOTTING=(wall)
MARKER_ANALYZE= ( inlet,outlet )
MARKER_ANALYZE_AVERAGE= MASSFLUX
%
% ------------- COMMON PARAMETERS DEFINING THE NUMERICAL METHOD ---------------%
%
NUM_METHOD_GRAD= WEIGHTED_LEAST_SQUARES
CFL_NUMBER=60
CFL_ADAPT= NO 
ITER=4000
%
% ------------------------ LINEAR SOLVER DEFINITION ---------------------------%
%
LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_PREC= LU_SGS
LINEAR_SOLVER_ERROR= 1E-10
LINEAR_SOLVER_ITER= 15
%
% -------------------------- MULTIGRID PARAMETERS -----------------------------%
%
MGLEVEL= 0
%
% -------------------- FLOW NUMERICAL METHOD DEFINITION -----------------------%
%
CONV_NUM_METHOD_FLOW= FDS
MUSCL_FLOW= YES
SLOPE_LIMITER_FLOW= NONE
TIME_DISCRE_FLOW= EULER_IMPLICIT
%
% -------------------- TURBULENT NUMERICAL METHOD DEFINITION ------------------%
%
CONV_NUM_METHOD_TURB= SCALAR_UPWIND
MUSCL_TURB= NO 
SLOPE_LIMITER_TURB= VENKATAKRISHNAN
%SLOPE_LIMITER_TURB= NONE 
TIME_DISCRE_TURB= EULER_IMPLICIT
%
% --------------------------- CONVERGENCE PARAMETERS --------------------------%
%
CONV_FIELD=(RMS_PRESSURE,RMS_VELOCITY-X,RMS_VELOCITY-Y,RMS_VELOCITY-Z,RMS_TKE,RMS_DISSIPATION)
CONV_RESIDUAL_MINVAL=-10
CONV_STARTITER= 10
CONV_CAUCHY_ELEMS= 100
CONV_CAUCHY_EPS= 1E-6
%
% ------------------------- INPUT/OUTPUT INFORMATION --------------------------%
%
MESH_FILENAME=../mesh.su2
SOLUTION_FILENAME=input
CONV_FILENAME=developed-history
RESTART_FILENAME=developed-restart
WRT_RESTART_OVERWRITE= YES
WRT_VOLUME_OVERWRITE= YES
WRT_SURFACE_OVERWRITE= YES
WRT_PERFORMANCE= YES
VOLUME_FILENAME= flow
OUTPUT_WRT_FREQ=100
SCREEN_WRT_FREQ_INNER= 1
SCREEN_WRT_FREQ_OUTER= 1
OUTPUT_FILES=(RESTART_ASCII)
SCREEN_OUTPUT=(INNER_ITER,RMS_PRESSURE,RMS_VELOCITY-X,RMS_VELOCITY-Y,RMS_VELOCITY-Z)
VOLUME_OUTPUT= SOLUTION PRIMITIVE RESIDUAL
HISTORY_OUTPUT=(ITER,RMS_RES,LINSOL,STREAMWISE_PERIODIC,SURFACE_MASSFLOW,SURFACE_TOTAL_PRESSURE)
READ_BINARY_RESTART=NO
WRT_RESTART_COMPACT=NO
KIND_INCOMP_SYSTEM=DENSITY_BASED
KIND_STREAMWISE_PERIODIC=PRESSURE_DROP
STREAMWISE_PERIODIC_PRESSURE_DROP=4.396106566543176
INC_OUTLET_DAMPING=0.01
MARKER_PERIODIC=(inlet,outlet,0,0,0,0,0,0,0,0,0.52)
